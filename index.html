<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeaLuxE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a class="logo header__logo" href="#">
            <img class="logo-img" src="images/logo.svg" alt="TealuxE logo" />
          </a>
          <nav class="menu">
            <ul class="menu__list">
              <li class="menu__item">
                <a class="menu__link" href="#">Black</a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#">Green</a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#">White</a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#">Oolong</a>
              </li>
              <li class="menu__item">
                <a class="menu__link" href="#">Pu-erh</a>
              </li>
            </ul>
          </nav>
          <ul class="user-actions user-actions--margin">
            <li class="user-actions__item">
              <a class="user-actions__link" href="#">
                <img class="user-actions__img" src="images/cart.svg" alt="" />
              </a>
            </li>
            <li class="user-actions__item">
              <a class="user-actions__link" href="#">
                <img class="user-actions__img" src="images/user.svg" alt="" />
              </a>
            </li>
            <li class="user-actions__item user-actions__item--search">
              <a class="user-actions__link" href="#">
                <img class="user-actions__img" src="images/search.svg" alt="" />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <script src="js/main.js"></script>
  </body>
</html>
